name: Deploy to Codeberg Pages

on:
    push:
        branches: ["main"]

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: mordor
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Bun
              run: |
                apk add --no-cache curl bash
                curl -fsSL https://bun.sh/install | bash -s -- bun-v1.3.14
                echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

            - name: Install Dependencies (IPv4 workaround)
              run: |
                IP=$(getent hosts registry.npmjs.org | awk '{print $1}' | grep -E '^[0-9.]+$' | head -1)
                echo "$IP registry.npmjs.org" >> /etc/hosts
                bun install

            - name: Build
              run: bun run build

            - name: Deploy to Pages
              uses: https://codeberg.org/git-pages/action@v2
              with:
                site: https://nealwang.dev/
                server: nealwang.dev
                token: ${{ forgejo.token }}
                source: build/
